name: CI/CD Pipeline & AWS Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION: Code Quality & Algorithmic Unit Tests
  # =========================================================================
  ci-tests:
    name: "🧪 Run CI Test Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Algorithm & Pipeline Unit Tests
        run: |
          pytest tests/test_algorithms.py -v --tb=short

  # =========================================================================
  # 2. CONTINUOUS DEPLOYMENT: Terraform Infrastructure (AWS us-east-1)
  # =========================================================================
  cd-terraform:
    name: "☁️ Terraform IaC (AWS us-east-1)"
    needs: ci-tests
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./infrastructure
        continue-on-error: true

      - name: Terraform Init
        run: terraform init
        working-directory: ./infrastructure

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infrastructure

      - name: Terraform Plan
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.terraform_action == 'plan' }}
        run: |
          terraform plan \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="instance_type=t3.micro"
        working-directory: ./infrastructure

      - name: Terraform Apply (On Manual Dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply' }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="instance_type=t3.micro"
          
          echo "### 🚀 AWS Recommendation System Deployment" >> $GITHUB_STEP_SUMMARY
          echo "* **Region**: \`us-east-1\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Instance Type**: \`t3.micro\` (AWS Free Tier)" >> $GITHUB_STEP_SUMMARY
          echo "* **Swagger Docs**: $(terraform output -raw swagger_ui_url 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "* **Health Check**: $(terraform output -raw health_url 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
        working-directory: ./infrastructure

      - name: Terraform Destroy (On Manual Dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'destroy' }}
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="instance_type=t3.micro"
          echo "### 🛑 AWS Infrastructure Successfully Destroyed ($0 Ongoing Cost)" >> $GITHUB_STEP_SUMMARY
        working-directory: ./infrastructure
